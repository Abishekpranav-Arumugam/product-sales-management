sonar.host.url=http://localhost:9000
sonar.projectKey=product-sales-management
sonar.projectName=product-sales-management
sonar.projectVersion=1.0

# WARNING: Never commit real tokens here.
# Set SONAR_TOKEN as a GitHub Actions secret and pass it via:
#   sonar-scanner -Dsonar.token="$SONAR_TOKEN"
# sonar.login and sonar.token are intentionally left blank.

sonar.sources=app
sonar.tests=tests
sonar.language=py
sonar.python.version=3

# Path to the coverage XML report required by SonarQube
sonar.python.coverage.reportPaths=coverage.xml