# ─────────────────────────────────────────────────────────────────────────────
# CI / CD Pipeline — Product Sales Management
#
# Triggers
#   • Every push to main, or any feature_* / bug_* branch
#   • Every pull-request targeting main
#   • Manual trigger (workflow_dispatch)
#
# Jobs
#   lint     → flake8 style check
#   test     → pytest + coverage gate (≥ 80 %)
#   build    → docker compose build validation
#   package  → create downloadable release tarball  (main only)
# ─────────────────────────────────────────────────────────────────────────────

name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - "feature_*"
      - "bug_*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# ── Shared Python version so every job stays in sync ─────────────────────────
env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (Flake8)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 app/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --statistics

  # ── 2. Test + Coverage ────────────────────────────────────────────────────────
  test:
    name: "Test (pytest ≥ 80 % coverage)"
    runs-on: ubuntu-latest
    needs: lint

    # Provide a minimal .env so the app can import without a real DB
    env:
      DATABASE_URL: "sqlite:///./test_product_db.db"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.xml
          retention-days: 7

  # ── 3. Docker Build Validation ───────────────────────────────────────────────
  build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build application images
        run: docker compose build web consumer

  # ── 4. Package & Release Artefact (main branch only) ─────────────────────────
  package:
    name: "Package Release"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release tarball
        run: |
          mkdir -p release
          tar --exclude=.git \
              --exclude=.env \
              --exclude=venv \
              --exclude=.venv \
              --exclude=__pycache__ \
              --exclude=.pytest_cache \
              --exclude=.coverage \
              --exclude=coverage.xml \
              --exclude=htmlcov \
              --exclude=sonar-project.properties \
              --exclude=logs \
              --exclude=exports \
              --exclude=scripts \
              --exclude=product_db \
              --exclude=product_db_test \
              -czf release/product-sales-management.tar.gz .

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: product-sales-management-${{ github.sha }}
          path: release/product-sales-management.tar.gz
          if-no-files-found: error
          retention-days: 14